# budget.lnf.gr -> budget-app (Next.js standalone, PM2 "budget-app", 127.0.0.1:3200)

map $http_upgrade $connection_upgrade_budget {
    default upgrade;
    ""      "";
}

# Login/register brute-force guard: 10 req/min per IP, small burst.
limit_req_zone $binary_remote_addr zone=budget_auth:10m rate=10r/m;

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name budget.lnf.gr;
    ssl_certificate /etc/letsencrypt/live/budget.lnf.gr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/budget.lnf.gr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    # Wallet JSON import is the largest request body.
    client_max_body_size 10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    location ~ ^/api/auth/(login|register)$ {
        limit_req zone=budget_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:3200;
        include /etc/nginx/snippets/budget-proxy.conf;
    }


    location / {
        proxy_pass http://127.0.0.1:3200;
        include /etc/nginx/snippets/budget-proxy.conf;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name budget.lnf.gr;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }
    location / {
        return 301 https://$host$request_uri;
    }
}
